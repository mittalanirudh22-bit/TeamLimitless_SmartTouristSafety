services:
  db:
    image: postgis/postgis:16-3.4
    container_name: limitless-postgis
    environment:
      POSTGRES_DB: tourist_safety
      POSTGRES_USER: limitless
      POSTGRES_PASSWORD: limitless_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
